[tool.poetry]
name = "metaculus-quant"
version = "0.1.0"
description = "Bot de pronósticos para los torneos de bots de Metaculus (basado en metac-bot-template)"
authors = ["metaculus-quant"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
numpy = "^2.3.0"
pyyaml = "^6.0"
forecasting-tools = "0.3.1"   # fijada: trae el ID del torneo de otoño 2026 (33121)

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Revisor de estilo (reglas comunes §6), con la misma configuración que los proyectos hermanos
# (cripto-quant y quiniela-quant, pyproject.toml, 25/09/2026).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TRY", "DTZ", "RUF"]
ignore = ["TRY003"]  # mensajes de error largos: aquí son deliberados y los lee una persona

[tool.ruff.lint.isort]
# Los módulos del proyecto (main.py y bot/) no son un paquete instalado: sin esto ruff los toma
# por librerías de terceros.
known-first-party = ["bot", "main", "tests"]
