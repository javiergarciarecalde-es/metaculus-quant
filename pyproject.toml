[tool.poetry]
name = "metaculus-quant"
version = "0.1.0"
description = "Bot de pronósticos para los torneos de bots de Metaculus (basado en metac-bot-template)"
authors = ["metaculus-quant"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
numpy = "^2.3.0"
pyyaml = "^6.0"
forecasting-tools = "0.3.1"   # fijada: trae el ID del torneo de otoño 2026 (33121)

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
