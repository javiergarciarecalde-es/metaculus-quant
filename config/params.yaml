# Parámetros de metaculus-quant.
# NO se ponen aquí claves ni tokens: van como secretos de GitHub.

# --- Puerta de la fase 0 (texto fijado ANTES de competir; NO CAMBIAR) ---
puerta_fase0:
  texto: >-
    Se suma la puntuación de pares de todas las rondas de la fase 0: las MiniBench
    de octubre a diciembre de 2026 y la temporada de otoño. El bot sigue solo si
    supera al mejor bot de Metaculus del momento Y su proyección cae entre los 20
    primeros de la temporada. Si no, se cierra.
  referencia: "1.º ~3.600 $/temporada, 10.º ~1.700 $, 20.º ~1.000-1.100 $, media tabla ~0"
  rondas: ["MiniBench octubre-diciembre 2026", "Temporada otoño 2026 (FutureEval)"]
  condicion_1: "suma de peer score > suma del mejor bot de Metaculus del momento"
  condicion_2: "proyección dentro del top 20 de la temporada"
  fijada_el: "2026-09-24"

# --- Torneos (identificadores de la API de Metaculus) ---
# 33121 = fall-futureeval-2026 según la librería forecasting-tools 0.3.1
# (MetaculusClient.FE_FALL_2026_ID). "minibench" = la MiniBench vigente.
torneos:
  temporada: 33121
  minibench: "minibench"
  prueba: "bot-testing-area"   # zona de pruebas oficial de Metaculus

# --- Modelos ---
# Los créditos gratuitos de Metaculus llegan como una clave de OpenRouter (OpenRouter = una
# tienda que da acceso a modelos de varias empresas con una sola clave). Esa clave solo sirve
# para modelos de OpenAI, Anthropic y Google (según las notas de nostreambot).
# - Si hay OPENROUTER_API_KEY (la de los créditos o una propia): bloque "openrouter".
# - Si solo hay METACULUS_TOKEN: bloque "proxy_metaculus" (intermediario de Metaculus,
#   prefijo "metaculus/"; qué modelos sirve NO está verificado).
# Tres modelos de tres empresas, una pasada cada uno (lo que usa nostreambot, ~10.º de 173
# en primavera 2026). "esfuerzo" = cuánto «piensa» el modelo antes de responder: el informe
# de primavera dice que es de lo que más pesa en el puesto final.
# Todos comprobados en la lista pública de OpenRouter el 25/09/2026 (sesión 2, en vivo, también
# gpt-6-sol y claude-opus-5.5). En cada ejecución `python -m bot.modelos` avisa si alguno
# desaparece (y el respaldo responde en su lugar).
modelos:
  openrouter:
    # modo "tres_empresas": un puesto por empresa. "respaldo" = modelo que responde si el
    # principal falla o contesta vacío (el anterior de la misma empresa, o uno de otra).
    pronostico:
      - {nombre: "openrouter/openai/gpt-6-sol", esfuerzo: "high", respaldo: "openrouter/openai/gpt-5.6-sol"}
      - {nombre: "openrouter/anthropic/claude-opus-5.5", esfuerzo: "high", respaldo: "openrouter/anthropic/claude-opus-4.8"}
      - {nombre: "openrouter/google/gemini-3.5-flash", esfuerzo: null, respaldo: "openrouter/openai/gpt-6-sol"}  # Gemini Pro: sin cuota con la clave donada
    # modo "un_modelo": la idea del usuario, un solo modelo potente repetido en los 3 puestos
    un_modelo: {nombre: "openrouter/anthropic/claude-opus-5.5", esfuerzo: "high", respaldo: "openrouter/openai/gpt-6-sol"}
    # Búsqueda de noticias: «:online» = el modelo busca en internet con el buscador de su empresa
    # (el que cubren los créditos de Metaculus). gpt-4o-search-preview dejó de existir en
    # OpenRouter (comprobado en vivo el 25/09/2026).
    investigacion: "openrouter/openai/gpt-5.6-sol:online"
    investigacion_esfuerzo: "low"
    lector: "openrouter/openai/gpt-4o-mini"
    director: "openrouter/anthropic/claude-opus-5.5"      # solo con investigacion.modo = ampliada
    buscador: "openrouter/openai/gpt-5.6-sol:online"     # solo con investigacion.modo = ampliada (esfuerzo = investigacion_esfuerzo)
  proxy_metaculus:
    pronostico:
      - {nombre: "metaculus/gpt-5", esfuerzo: "high", respaldo: "metaculus/claude-sonnet-4-5"}
      - {nombre: "metaculus/claude-sonnet-4-5", esfuerzo: null, respaldo: "metaculus/gpt-5"}
    un_modelo: {nombre: "metaculus/claude-sonnet-4-5", esfuerzo: null, respaldo: "metaculus/gpt-5"}
    investigacion: "metaculus/gpt-4o-search-preview"
    investigacion_esfuerzo: null  # null = sin campo de esfuerzo (antes: el código lo daba por vacío si faltaba)
    lector: "metaculus/gpt-4o-mini"
    director: "metaculus/claude-sonnet-4-5"
    buscador: "metaculus/gpt-4o-search-preview"
  temperatura: null           # null = la que decida el modelo (lo recomendado en modelos que razonan)
  tiempo_max_segundos: 600
  # Los siguientes estaban fijos en main.py hasta el 25/09/2026 (orden 14: sin números escondidos
  # en el código). Mismos valores que tenían; los de lector y resumidor, los de la plantilla oficial.
  temperatura_lector: 0.0       # «lector» = modelo que lee la respuesta si las expresiones regulares fallan
  temperatura_resumidor: 0.3    # el resumen de la investigación está apagado; se conserva como la plantilla
  lector_validaciones: 2        # lecturas que deben coincidir al leer una respuesta con el lector (plantilla)
  intentos:                     # cuántas veces se prueba cada modelo antes de darlo por fallido
    con_respaldo: 1             # el principal, si tiene respaldo: si falla, entra el respaldo sin esperar
    sin_respaldo: 2
    respaldo: 2
    busqueda: 1                 # búsqueda de noticias (y buscadores de la ampliada): 1 intento, si falla sin noticias

# --- Pronóstico ---
pronostico:
  # tres_empresas = 3 modelos de 3 empresas (recomendado) | un_modelo = 3 pasadas del mismo
  # modelo potente (Opus 5.5). Nadie ha medido cuál gana: ver HALLAZGOS 25/09/2026.
  modo: "tres_empresas"
  pasadas_por_pregunta: 3        # veces que se pregunta a un modelo; se reparten en rueda entre los modelos
  informes_investigacion: 1      # búsquedas de noticias por pregunta (compartidas por todos los modelos)
  factor_extremizar: 1.0         # 1.0 = APAGADO. nostreambot lo probó y lo descartó (ver HALLAZGOS)
  prob_min: 0.02                 # nunca por debajo del 2 % (igual que nostreambot)
  prob_max: 0.98                 # nunca por encima del 98 %
  minimo_por_opcion: 0.01        # en preguntas de opciones, ninguna por debajo del 1 %
  max_preguntas_ensayo: 3        # en ensayo manual, solo estas preguntas (ahorra créditos)

# --- Investigación ---
# basica   = una búsqueda de noticias (como hasta ahora).
# ampliada = además, un «director» elige hasta 2 datos clave (uno siempre: qué dice hoy la
#            fuente que resuelve la pregunta) y 2 «buscadores» los comprueban a la vez. Lo que
#            encuentran se AÑADE al final del informe; nunca lo reescribe. APAGADA hasta medir
#            su coste real en un ensayo.
# claude_max = además, Claude Opus 5.5 con varios agentes investiga en la web, pagado con la
#            suscripción Claude Max del usuario (decisión 25/09/2026). Solo actúa si existe el
#            secreto CLAUDE_CODE_OAUTH_TOKEN; si no, o si falla o se agota el cupo -> «basica».
investigacion:
  modo: "claude_max"            # basica | ampliada | claude_max
  max_datos_clave: 2
  tope_total_segundos: 240
  # Estos dos estaban fijos en el código hasta el 25/09/2026 (orden 14); mismos valores.
  busquedas_a_la_vez: 1          # búsquedas de noticias a la vez, en la plantilla oficial también 1
  max_caracteres_informe: 6000   # letras del informe de noticias que se pasan al director y a Claude
  max_enlaces_resolucion: 5      # enlaces de las condiciones de resolución que se dan a la búsqueda «para consultar primero» (25/09/2026)
  claude_max:
    modelo: "claude-opus-5-5"
    agentes: 3                   # investigadores en paralelo por pregunta
    max_turnos: 30
    tope_segundos: 300           # por pregunta; si se pasa, se sigue sin ella
    simultaneas: 3               # preguntas investigadas a la vez
    tope_usd_por_pregunta: 3     # freno de Claude Code (en $ equivalentes de API)
    minutos_minimos_antes_del_cierre: 30  # si la pregunta cierra antes, se salta esta investigación (25/09/2026)

# --- Tiempos (el flujo de GitHub corta a los 60 min; la investigación con Claude Max suma hasta 5) ---
tiempos:
  tope_pasada_segundos: 900          # una pasada (modelo + respaldo) nunca más de 15 min
  tope_busqueda_segundos: 180        # búsqueda de noticias: 3 min, 1 intento; si falla, sin noticias
  dejar_de_empezar_tras_minutos: 28  # pasado esto no se empiezan preguntas nuevas (las coge la siguiente ejecución)

# --- Lo que sigue estaba fijo en el código hasta el 25/09/2026 (orden 14); mismos valores ---
registro:
  max_caracteres_razonamiento: 600   # letras del razonamiento que se guardan por pregunta
  max_caracteres_error: 300          # letras del error que se guardan cuando una pregunta falla

marcador:
  horas_de_espera: 24                # solo cuenta pronósticos de hace más de esto (pregunta ya cerrada)
  pausa_entre_preguntas_segundos: 0.5  # sin prisas con la API de Metaculus
  # Comparador de formas de juntar a los 3 modelos (decisión del usuario del 25/09/2026).
  # Decididas de antemano (docs/ESTUDIO_BOTS.md §3): como mucho 3; el resto es exploratorio.
  comparador:
    preregistradas: ["media", "sin google", "límites 1%-99%"]
    minimo_preguntas: 150            # resueltas, antes de dar por buena una variante
    limites_alternativos: [0.01, 0.99]  # la variante «límites 1%-99%» (el bot usa 2-98 %)

red:
  tiempo_espera_segundos: 30         # espera máxima de cada consulta a Metaculus o a la lista de OpenRouter
