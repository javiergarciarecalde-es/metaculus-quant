# Parámetros de metaculus-quant.
# NO se ponen aquí claves ni tokens: van como secretos de GitHub.

# --- Puerta de la fase 0 (texto fijado ANTES de competir; NO CAMBIAR) ---
puerta_fase0:
  texto: >-
    Se suma la puntuación de pares de todas las rondas de la fase 0: las MiniBench
    de octubre a diciembre de 2026 y la temporada de otoño. El bot sigue solo si
    supera al mejor bot de Metaculus del momento Y su proyección cae entre los 20
    primeros de la temporada. Si no, se cierra.
  referencia: "1.º ~3.600 $/temporada, 10.º ~1.700 $, 20.º ~1.000-1.100 $, media tabla ~0"
  rondas: ["MiniBench octubre-diciembre 2026", "Temporada otoño 2026 (FutureEval)"]
  condicion_1: "suma de peer score > suma del mejor bot de Metaculus del momento"
  condicion_2: "proyección dentro del top 20 de la temporada"
  fijada_el: "2026-09-24"

# --- Torneos (identificadores de la API de Metaculus) ---
# 33121 = fall-futureeval-2026 según la librería forecasting-tools 0.3.1
# (MetaculusClient.FE_FALL_2026_ID). "minibench" = la MiniBench vigente.
torneos:
  temporada: 33121
  minibench: "minibench"
  prueba: "bot-testing-area"   # zona de pruebas oficial de Metaculus

# --- Modelos ---
# Los créditos gratuitos de Metaculus llegan como una clave de OpenRouter (OpenRouter = una
# tienda que da acceso a modelos de varias empresas con una sola clave). Esa clave solo sirve
# para modelos de OpenAI, Anthropic y Google (según las notas de nostreambot).
# - Si hay OPENROUTER_API_KEY (la de los créditos o una propia): bloque "openrouter".
# - Si solo hay METACULUS_TOKEN: bloque "proxy_metaculus" (intermediario de Metaculus,
#   prefijo "metaculus/"; qué modelos sirve NO está verificado).
# Tres modelos de tres empresas, una pasada cada uno (lo que usa nostreambot, ~10.º de 173
# en primavera 2026). "esfuerzo" = cuánto «piensa» el modelo antes de responder: el informe
# de primavera dice que es de lo que más pesa en el puesto final.
# Todos comprobados en la lista pública de OpenRouter el 25/09/2026 (sesión 2, en vivo, también
# gpt-6-sol y claude-opus-5.5). En cada ejecución `python -m bot.modelos` avisa si alguno
# desaparece (y el respaldo responde en su lugar).
modelos:
  openrouter:
    # modo "tres_empresas": un puesto por empresa. "respaldo" = modelo que responde si el
    # principal falla o contesta vacío (el anterior de la misma empresa, o uno de otra).
    pronostico:
      - {nombre: "openrouter/openai/gpt-6-sol", esfuerzo: "high", respaldo: "openrouter/openai/gpt-6-astra"}  # decisión del usuario del 28/09/2026: de OpenAI solo GPT-6 Sol (uso común) y GPT-6 Astra (razonamiento más avanzado)
      - {nombre: "openrouter/anthropic/claude-opus-5.5", esfuerzo: "high", respaldo: null}  # decisión del usuario del 28/09/2026: de Anthropic solo Opus 5.5 (antes, respaldo Opus 4.8); sin respaldo se reintenta una vez
      - {nombre: "openrouter/google/gemini-3.8-flash", esfuerzo: null, respaldo: "openrouter/openai/gpt-6-sol"}  # decisión del usuario del 28/09/2026 (~08:50): Gemini 3.8 Flash en vez de 3.5 Flash (permitido por la clave; la mitad de precio: 0,75/3,75 $ frente a 1,5/9 $ por millón de tokens). Gemini Pro: sin cuota con la clave donada
    # modo "un_modelo": la idea del usuario, un solo modelo potente repetido en los 3 puestos
    un_modelo: {nombre: "openrouter/anthropic/claude-opus-5.5", esfuerzo: "high", respaldo: "openrouter/openai/gpt-6-sol"}
    # Búsqueda de noticias: «:online» = el modelo busca en internet con el buscador de su empresa
    # (el que cubren los créditos de Metaculus). gpt-4o-search-preview dejó de existir en
    # OpenRouter (comprobado en vivo el 25/09/2026).
    investigacion: "openrouter/anthropic/claude-opus-5.5:online"  # decisión del usuario del 28/09/2026 («el de mayor calidad y rigor analítico»); antes gpt-5.6-sol:online
    investigacion_respaldo: "openrouter/openai/gpt-6-sol:online"  # 28/09/2026: si la búsqueda principal falla o sale vacía, busca este (antes se pronosticaba sin noticias). null = sin respaldo
    investigacion_esfuerzo: "low"
    clasificador: "openrouter/google/gemini-3.8-flash"  # 28/09/2026, en sombra: dice si cada pregunta es fácil/normal/difícil (fracciones de céntimo); no decide nada. null = apagado
    lector: "openrouter/openai/gpt-6-sol"  # decisión del usuario del 28/09/2026 (~11:35): antes gpt-4o-mini; solo actúa si la lectura automática de la respuesta falla
    director: "openrouter/anthropic/claude-opus-5.5"      # solo con investigacion.modo = ampliada
    buscador: "openrouter/anthropic/claude-opus-5.5:online"  # solo con investigacion.modo = ampliada (esfuerzo = investigacion_esfuerzo); 28/09/2026: igual que la búsqueda
  proxy_metaculus:
    pronostico:
      - {nombre: "metaculus/gpt-5", esfuerzo: "high", respaldo: "metaculus/claude-sonnet-4-5"}
      - {nombre: "metaculus/claude-sonnet-4-5", esfuerzo: null, respaldo: "metaculus/gpt-5"}
    un_modelo: {nombre: "metaculus/claude-sonnet-4-5", esfuerzo: null, respaldo: "metaculus/gpt-5"}
    investigacion: "metaculus/gpt-4o-search-preview"
    investigacion_respaldo: null
    investigacion_esfuerzo: null
    clasificador: null  # null = sin campo de esfuerzo (antes: el código lo daba por vacío si faltaba)
    lector: "metaculus/gpt-4o-mini"
    director: "metaculus/claude-sonnet-4-5"
    buscador: "metaculus/gpt-4o-search-preview"
  temperatura: null           # null = la que decida el modelo (lo recomendado en modelos que razonan)
  tiempo_max_segundos: 600
  # Los siguientes estaban fijos en main.py hasta el 25/09/2026 (orden 14: sin números escondidos
  # en el código). Mismos valores que tenían; los de lector y resumidor, los de la plantilla oficial.
  temperatura_lector: null      # «lector» = modelo que lee la respuesta si las expresiones regulares fallan. 28/09/2026: null (antes 0.0) porque GPT-6 Sol razona y puede no aceptar temperatura 0
  temperatura_resumidor: 0.3    # el resumen de la investigación está apagado; se conserva como la plantilla
  lector_validaciones: 2        # lecturas que deben coincidir al leer una respuesta con el lector (plantilla)
  intentos:                     # cuántas veces se prueba cada modelo antes de darlo por fallido
    con_respaldo: 1             # el principal, si tiene respaldo: si falla, entra el respaldo sin esperar
    sin_respaldo: 2
    respaldo: 2
    busqueda: 1                 # búsqueda de noticias (y buscadores de la ampliada): 1 intento, si falla sin noticias

# --- Pronóstico ---
pronostico:
  # tres_empresas = 3 modelos de 3 empresas (recomendado) | un_modelo = 3 pasadas del mismo
  # modelo potente (Opus 5.5). Nadie ha medido cuál gana: ver HALLAZGOS 25/09/2026.
  modo: "tres_empresas"
  pasadas_por_pregunta: 3        # veces que se pregunta a un modelo; se reparten en rueda entre los modelos
  informes_investigacion: 1      # búsquedas de noticias por pregunta (compartidas por todos los modelos)
  factor_extremizar: 1.0         # 1.0 = APAGADO. nostreambot lo probó y lo descartó (ver HALLAZGOS)
  prob_min: 0.02                 # nunca por debajo del 2 % (igual que nostreambot)
  prob_max: 0.98                 # nunca por encima del 98 %
  minimo_por_opcion: 0.01        # en preguntas de opciones, ninguna por debajo del 1 %
  max_preguntas_ensayo: 3        # en ensayo manual y en la zona de pruebas (también con envío, desde el 27/09/2026), solo estas preguntas (ahorra créditos)

# --- Investigación ---
# basica   = una búsqueda de noticias (como hasta ahora).
# ampliada = además, un «director» elige hasta 2 datos clave (uno siempre: qué dice hoy la
#            fuente que resuelve la pregunta) y 2 «buscadores» los comprueban a la vez. Lo que
#            encuentran se AÑADE al final del informe; nunca lo reescribe. APAGADA hasta medir
#            su coste real en un ensayo.
# claude_max = además, Claude Opus 5.5 con varios agentes investiga en la web, pagado con la
#            suscripción Claude Max del usuario (decisión 25/09/2026). Solo actúa si existe el
#            secreto CLAUDE_CODE_OAUTH_TOKEN; si no, o si falla o se agota el cupo -> «basica».
investigacion:
  modo: "basica"                # basica | ampliada | claude_max. Orden 82 (decisión del usuario del 07/10/2026): «basica» = todas las preguntas con la búsqueda de pago, sin el plan de Claude del usuario (antes «claude_max»: Claude investigaba las pares). Para volver: «claude_max»
  max_datos_clave: 2
  tope_total_segundos: 240
  # Estos dos estaban fijos en el código hasta el 25/09/2026 (orden 14); mismos valores.
  busquedas_a_la_vez: 1          # búsquedas de noticias a la vez, en la plantilla oficial también 1
  max_caracteres_informe: 6000   # letras del informe de noticias que se pasan al director y a Claude
  max_enlaces_resolucion: 5      # enlaces de las condiciones de resolución que se dan a la búsqueda «para consultar primero» (25/09/2026)
  claude_max:
    modelo: "claude-opus-5-5"
    agentes: 3                   # investigadores en paralelo por pregunta
    max_turnos: 30
    tope_segundos: 300           # por pregunta; si se pasa, se sigue sin ella
    simultaneas: 3               # preguntas investigadas a la vez
    tope_usd_por_pregunta: 3     # freno de Claude Code (en $ equivalentes de API)
    minutos_minimos_antes_del_cierre: 30  # si la pregunta cierra antes, se salta esta investigación (25/09/2026)
    una_de_cada: 2               # decisión del usuario del 27/09/2026: Claude investiga solo las preguntas de número par (mitad del gasto de su plan) y las impares son el grupo de comparación; 1 = todas
    sustituye_busqueda: true     # opción A del usuario (28/09/2026): en las preguntas del reparto, Claude investiga EN LUGAR de la búsqueda de pago (ahorra créditos; la de pago solo si Claude no trae nada). false = Claude se suma a la búsqueda de pago, como hasta el 28/09
    pausada_hasta_utc: "2026-09-28T09:00:00+00:00"  # decisión del usuario del 27/09/2026 (21:25): sin Claude hasta que su tope semanal se renueve (11:00 de Madrid); luego vuelve sola. null = sin pausa

# --- Clasificador en sombra (decisión del usuario del 28/09/2026; bot/clasificador.py) ---
clasificador:
  tope_segundos: 30              # si tarda más, se sigue sin clasificación (no retrasa la pregunta)
  max_caracteres: 3000           # letras de la pregunta y sus condiciones que se le pasan
  claude:                        # el mismo clasificador, en paralelo, con Claude Code y el plan Max del usuario (decisión del 28/09/2026); sin herramientas; respeta la pausa de investigacion.claude_max
    activo: false                # orden 82 (decisión del usuario del 07/10/2026): apagado para no gastar el plan de Claude del usuario (antes true). Para volver: true
    modelo: "claude-opus-5-5"
    esfuerzo: "xhigh"            # «extra alto», pedido por el usuario (docs de Claude Code: low, medium, high, xhigh, max)
    max_turnos: 2                # sin herramientas basta con 1; 2 de margen
    tope_usd: 1                  # freno de Claude Code en $ equivalentes de API (gasta plan, no créditos)
    tope_segundos: 180           # corre a la vez que la pregunta; si tarda más, se apunta «tiempo»
    simultaneas: 3               # clasificaciones con Claude a la vez

# --- Tiempos (el flujo de GitHub corta a los 60 min; la investigación con Claude Max suma hasta 5) ---
tiempos:
  tope_pasada_segundos: 900          # una pasada (modelo + respaldo) nunca más de 15 min
  tope_busqueda_segundos: 180        # búsqueda de noticias: 3 min, 1 intento; si falla, sin noticias
  dejar_de_empezar_tras_minutos: 28  # pasado esto no se empiezan preguntas nuevas (las coge la siguiente ejecución)

# --- Lo que sigue estaba fijo en el código hasta el 25/09/2026 (orden 14); mismos valores ---
registro:
  max_caracteres_razonamiento: 600   # letras del razonamiento que se guardan por pregunta
  max_caracteres_error: 300          # letras del error que se guardan cuando una pregunta falla

marcador:
  horas_de_espera: 24                # solo cuenta pronósticos de hace más de esto (pregunta ya cerrada)
  pausa_entre_preguntas_segundos: 0.5  # sin prisas con la API de Metaculus
  perdidas_desde_utc: "2026-09-27T19:04:00+00:00"  # envío real encendido (21:04 de Madrid): las preguntas que cerraron antes no cuentan como perdidas (28/09/2026)
  dias_preguntas_perdidas: 7         # lista de preguntas cerradas sin pronóstico nuestro (27/09/2026): días que mira el marcador de cada lunes
  dias_resumen_gasto: 7              # «en qué se va el dinero» (orden 26, 27/09/2026): días que resume el marcador de cada lunes
  # Comparador de formas de juntar a los 3 modelos (decisión del usuario del 25/09/2026).
  # Decididas de antemano (docs/ESTUDIO_BOTS.md §3): como mucho 3; el resto es exploratorio.
  comparador:
    preregistradas: ["media", "sin google", "curva suave (PCHIP)"]  # decisión del usuario del 27/09/2026 (~22:40): la curva suave sustituye a «límites 1%-99%» (queda exploratoria), antes de ver ningún resultado
    minimo_preguntas: 150            # resueltas, antes de dar por buena una variante
    limites_alternativos: [0.01, 0.99]  # la variante «límites 1%-99%» (el bot usa 2-98 %)

presupuesto:
  # Tope de gasto de los créditos de Metaculus (orden 26 del mando, 27/09/2026). Lo gastado y lo
  # que queda se leen de la propia clave de OpenRouter (bot/presupuesto.py); estos números solo
  # deciden cuánto se deja empezar. Solo actúan si existe OPENROUTER_API_KEY.
  total_usd: 100                  # correo de Metaculus del 27/09/2026: 100 $ para FutureEval y MiniBench (se pidieron 270). Solo se usa si la clave no trae su propio límite
  reserva_usd: 3                  # por debajo de esto no se empieza nada (aviso, sin error rojo): cubre lo que OpenRouter tarda en sumar y el error de la previsión; ~9 preguntas
  coste_previsto_por_pregunta_usd: 0.40  # para contar cuántas caben: ensayo del 27/09 = 0,11-0,23 $ medidos por la librería SIN la búsqueda de noticias (que no mide); estimación previa 0,34; con margen
  tope_por_pregunta_usd: 1.50     # freno por pregunta: pasado esto, se cortan las llamadas que falten (solo cuenta lo que la librería sabe medir; ~6 veces lo medido)
  ritmo:                          # solo para la temporada: la MiniBench va primero (decide si llega más dinero)
    inicio: "2026-09-28"          # abre la temporada de otoño (anuncio, notebook 45615)
    fin: "2027-01-06"             # últimos pronósticos de la temporada (docs/MAESTRO.md)
    colchon_inicial: 0.25         # fracción del dinero que se puede llevar gastada desde el primer día (una ronda de MiniBench ~60 preguntas ≈ 20-25 $); el resto, repartido por igual hasta el final

plan_claude:
  # Tope del plan de Claude del usuario (orden 27 del mando, aprobada por el usuario el 28/09/2026;
  # bot/plan_claude.py). Cuenta la investigación de las pares, el clasificador con Opus y la
  # vigilancia cuando despierta a Claude, en $ equivalentes de API por semana del plan.
  tope_fraccion_semanal: 0.15     # propuesta del mando (orden 27): el bot no pasa del 15 % del tope semanal del plan
  usd_por_punto_semanal: 5        # $ equivalentes que mueven un 1 % el tope semanal. Medido el 27/09/2026: 5-6,6 $ por punto (con otras sesiones gastando a la vez, así que es cota baja); se toma la más baja para frenar antes
  reserva_revision_usd: 5         # para la revisión semanal de los lunes (rutina en la nube, fuera del bot): estimación, se corrige al medirla
  apagar_opus_desde: 0.8          # propuesta del mando: pasado el 80 % del tope se apaga primero el clasificador en sombra con Opus (no decide nada)
  reinicio_semanal:               # cuándo se renueva el tope semanal del plan: visto en la tarjeta de uso de la aplicación el 28/09/2026 (lunes 09:00 UTC = 11:00 de Madrid)
    dia: 0                        # 0 = lunes
    hora_utc: 9

red:
  tiempo_espera_segundos: 30         # espera máxima de cada consulta a Metaculus o a la lista de OpenRouter

vigilancia:
  # Vigilancia que reacciona sola (orden 26 del mando; decisión del usuario del 27/09/2026 ~21:55:
  # «que no me avise a mí»). Flujo .github/workflows/vigilancia.yaml, lógica en bot/vigilancia.py.
  # Solo actúa con ENVIO_REAL=true. Nunca pronostica: relanza el bot y, si no basta, despierta a Claude.
  flujo_bot: "run_bot_on_tournament.yaml"   # el flujo que vigila y relanza
  ejecuciones_a_mirar: 30                   # últimas ejecuciones del bot que lee de GitHub (~10 h con una cada 20 min)
  minutos_sin_ejecucion_buena: 45           # silencio: más que esto sin una ejecución de torneo terminada bien (el bot sale cada 20 min)
  minutos_margen_pregunta_nueva: 60         # una pregunta sin pronóstico solo cuenta como olvidada si lleva abierta más que esto (el bot tiene 3 ejecuciones para cogerla)
  ventana_horas_relanzamientos: 3           # relanzamientos de la vigilancia que se cuentan para despertar a Claude
  relanzamientos_antes_de_claude: 2         # si ya van estos relanzamientos en la ventana y el problema sigue: nivel 2 (Claude)
  horas_entre_claude: 12                    # como mucho un despertar de Claude (un issue) cada tantas horas, para cuidar el plan del usuario
  max_despertares_semana: 2                 # orden 27 (28/09/2026): como mucho 2 despertares de Claude por semana del plan (≤10 $ equivalentes, ~2 % del tope semanal); antes podían ser 14
  max_caracteres_errores: 20000             # líneas de error del registro que se le enseñan a Claude
  claude:
    activo: false                # orden 82 (decisión del usuario del 07/10/2026): la vigilancia ya no despierta a Claude (gastaba el plan del usuario); sigue relanzando el bot y avisando en su resumen. Antes no existía (= encendida). Para volver: true
    modelo: "claude-opus-5-5"
    max_turnos: 40
    tope_usd: 5                  # freno de Claude Code en $ equivalentes de la API (gasta el plan del usuario, no dinero)
    tope_segundos: 1200          # 20 min; el trabajo del flujo corta a los 30
